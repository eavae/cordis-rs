[workspace]
resolver = "3"
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-loader",
    "crates/cordis-plugin-group",
    "crates/cordis-plugin-include",
    "crates/cordis-plugin-timer",
    "crates/cordis-plugin-logger-console",
    "crates/cordis-utils",
    "crates/cordis-sdk",
    "crates/cordis-macros",
    "crates/cordis-plugin-hmr",
    "crates/cordis-cli",
    "fixtures/hello-plugin",
    "fixtures/bad-version",
    "fixtures/not-a-plugin",
    "fixtures/spawn-fixture",
    "fixtures/meta",
    "fixtures/context",
    "fixtures/builder",
]

[workspace.package]
# Kept in lockstep with the upstream `cordis` package version this port
# follows (see README.md §Version alignment).
version = "4.0.0-rc.8"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/cordisjs/cordis-rs"

[workspace.dependencies]
# Runtime / async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
async-ffi = "0.5.1"
parking_lot = "0.12"
arc-swap = "1"
im = "15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
minijinja = "2"

# Plugin loading (`.so` / `.dylib` / `.dll`)
libloading = "0.8"
notify = "8"

# Errors
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Curated pedantic/nursery lints that are mechanical and uncontroversial.
# `scripts/quality.sh` promotes them to errors via `-D warnings`.
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
map_unwrap_or = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
use_self = "warn"
