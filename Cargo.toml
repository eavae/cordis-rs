[workspace]
resolver = "3"
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-loader",
    "crates/cordis-plugin-group",
    "crates/cordis-plugin-include",
    "crates/cordis-plugin-timer",
    "crates/cordis-plugin-logger-console",
    "crates/cordis-utils",
    "crates/cordis-sdk",
    "crates/cordis-macros",
    "crates/cordis-plugin-hmr",
    "crates/cordis-cli",
    "fixtures/hello-plugin",
    "fixtures/bad-version",
    "fixtures/not-a-plugin",
    "fixtures/spawn-fixture",
    "fixtures/meta",
    "fixtures/context",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/cordisjs/cordis-rs"

[workspace.dependencies]
# Runtime / async
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
minijinja = "2"

# Plugin loading (`.so` / `.dylib` / `.dll`)
libloading = "0.8"
notify = "8"

# Errors
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
