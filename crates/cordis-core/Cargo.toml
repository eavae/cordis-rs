[package]
name = "cordis-core"
description = "Cordis core runtime: context, fiber, events, registry, logger (Rust port)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cordis-macros = { path = "../cordis-macros" }
tokio.workspace = true

[dev-dependencies]
# `test-util` enables tokio's fake clock (time::pause / time::advance),
# which backs the `with_timers` behavior-test helper (A2).
tokio = { workspace = true, features = ["test-util"] }
