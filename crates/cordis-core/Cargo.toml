[package]
name = "cordis-core"
description = "Cordis core runtime: context, fiber, events, registry, logger (Rust port)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap.workspace = true
cordis-macros = { path = "../cordis-macros" }
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
tokio.workspace = true

[features]
deadlock-detection = ["parking_lot/deadlock_detection"]

[dev-dependencies]
# `test-util` enables tokio's fake clock (time::pause / time::advance),
# which backs the `with_timers` behavior-test helper.
loom = "0.7"
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
