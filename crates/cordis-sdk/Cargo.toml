[package]
name = "cordis-sdk"
description = "Plugin author SDK: the single crate `.so` plugins depend on"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["abi-exports"]
abi-exports = []

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
cordis-core = { path = "../cordis-core" }
cordis-macros = { path = "../cordis-macros" }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
libloading.workspace = true
